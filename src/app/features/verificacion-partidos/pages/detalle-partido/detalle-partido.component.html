<section class="detalle-partido">
  <!-- Botón volver -->
  <div class="detalle-partido__back">
    <button class="btn-volver" (click)="volverAtras()">← Volver</button>
  </div>

  <!-- Contenido principal -->
  <ng-container *ngIf="loading; else noLoading">
    <div class="loading-state">
      <p>Cargando partido...</p>
    </div>
  </ng-container>

  <ng-template #noLoading>
    <ng-container *ngIf="error; else noError">
      <div class="error-state">
        <p>{{ errorMessage }}</p>
        <button class="btn btn--primary" (click)="cargarPartido()">Reintentar</button>
      </div>
    </ng-container>

    <ng-template #noError>
      <ng-container *ngIf="partido; else noPartido">
        <!-- Header con información básica -->
        <div class="detalle-partido__header">
          <div class="header-info">
            <div class="header-info__estado-badge" [style.background-color]="getColorEstado()">
              {{ obtenerEstado() }}
            </div>
            <h1 class="header-info__nombre">{{ partido.nombre }}</h1>
            <p class="header-info__sigla">
              <strong>Sigla:</strong> {{ partido.sigla }}
            </p>
            <p class="header-info__registrador">
              <strong>Registrador:</strong> ID {{ partido.idRegistrador }}
            </p>
          </div>
        </div>

        <!-- Visor de documentos -->
        <div class="detalle-partido__documentos">
          <app-visor-documentos-partido [idPartido]="partido.idPartido"></app-visor-documentos-partido>
        </div>

        <!-- Acciones -->
        <div class="detalle-partido__acciones">
          <button
            class="btn btn--success"
            (click)="aprobarSolicitud()"
            [disabled]="procesandoAprobacion || procesandoRechazo || partido.activo"
          >
            {{ procesandoAprobacion ? 'Aprobando...' : 'Aprobar Solicitud' }}
          </button>

          <button
            class="btn btn--danger"
            (click)="rechazarSolicitud()"
            [disabled]="procesandoAprobacion || procesandoRechazo || !partido.activo"
          >
            {{ procesandoRechazo ? 'Rechazando...' : 'Rechazar Solicitud' }}
          </button>
        </div>

        <!-- Toast -->
        <app-toast
          *ngIf="showToast"
          [message]="toastMessage"
          [type]="toastType"
          (close)="onCloseToast()"
        ></app-toast>
      </ng-container>

      <ng-template #noPartido>
        <div class="empty-state">
          <p>No se encontró el partido</p>
        </div>
      </ng-template>
    </ng-template>
  </ng-template>
</section>
