<div class="visor-documentos">
  <h3 class="visor-documentos__titulo">Documentos del Partido</h3>

  <div class="visor-documentos__grid">
    <div *ngFor="let documento of documentos" class="documento-card">
      <!-- Icono y nombre -->
      <div class="documento-card__header">
        <span class="documento-card__icono">{{ documento.icono }}</span>
        <h4 class="documento-card__label">{{ documento.label }}</h4>
      </div>

      <!-- Área de visualización -->
      <div class="documento-card__preview">
        <!-- Ya cargado → mostrar PDF -->
        <ng-container *ngIf="estaCargado(documento.tipo); else noMostrado">
          <embed
            [src]="documentoUrlSanitizada[documento.tipo]"
            type="application/pdf"
            class="documento-card__pdf"
          />
        </ng-container>

        <!-- No cargado aún -->
        <ng-template #noMostrado>
          <div class="documento-card__placeholder">
            <!-- Cargando -->
            <ng-container *ngIf="esCargando(documento.tipo)">
              <p class="documento-card__sin-cargar">Cargando documento...</p>
            </ng-container>

            <!-- Error -->
            <ng-container *ngIf="hayError(documento.tipo) && !esCargando(documento.tipo)">
              <p class="documento-card__error">{{ getMensajeError(documento.tipo) }}</p>
              <button class="btn btn--ghost" (click)="verDocumento(documento)">Reintentar</button>
            </ng-container>

            <!-- Sin cargar todavía → botón Ver -->
            <ng-container *ngIf="!esCargando(documento.tipo) && !hayError(documento.tipo)">
              <p class="documento-card__sin-cargar">Haga click para ver el documento</p>
              <button class="btn btn--primary" (click)="verDocumento(documento)">
                Ver documento
              </button>
            </ng-container>
          </div>
        </ng-template>
      </div>

      <!-- Botón descargar — siempre visible -->
      <div class="documento-card__acciones">
        <button
          class="btn btn--ghost"
          (click)="descargarDocumento(documento)"
          [disabled]="esCargando(documento.tipo)"
        >
          Descargar
        </button>
      </div>
    </div>
  </div>
</div>
