<!-- ═══════════════════ TOPBAR ═══════════════════ -->
<div class="topbar">
  <div class="container topbar__inner">
    <div class="topbar__left">
      <span>🇨🇴</span>
      <span>República de Colombia</span>
      <span class="topbar__sep">·</span>
      <span>Registraduría Nacional del Estado Civil</span>
      <span class="topbar__sep">·</span>
      <span>Portal Oficial de Funcionarios</span>
    </div>

    <div class="topbar__right">
      <span class="topbar__link">01 8000 11 60 34</span>
      <span class="topbar__link">Ayuda</span>
      <span class="topbar__link">Accesibilidad</span>
    </div>
  </div>
</div>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="header">
  <div class="header__inner">
    <!-- LOGO -->
    <a routerLink="/" class="logo">
      <div class="logo__shield">
        <svg fill="none" viewBox="0 0 24 24">
          <path
            d="M9 12l2 2 4-4m5.6-4A12 12 0 0112 3 12 12 0 013.4 6 12 12 0 003 9c0 5.5 3.8 10.2 9 11.6C17.2 19.2 21 14.5 21 9c0-1-.1-2-.4-3z"
          />
        </svg>
      </div>

      <div class="logo__text">
        <span class="logo__name">Vote<em>4</em>Tech</span>
        <span class="logo__sub">Sistema Electoral Nacional</span>
      </div>
    </a>

    <!-- NAV CON MENÚS DESPLEGABLES POR HOVER -->
    <nav class="nav" *ngIf="isAuthenticated">
      <!-- GESTIÓN ELECTORAL -->
      <div class="nav__dropdown">
        <button class="nav__dropdown-title">🗳️ Gestión Electoral</button>
        <div class="nav__dropdown-menu">
          <button class="nav__dropdown-item" (click)="navigateTo('/eleccion/crear')">
            Crear Elección
          </button>
        </div>
      </div>

      <!-- REGISTRO -->
      <div class="nav__dropdown">
        <button class="nav__dropdown-title">➕ Registro</button>
        <div class="nav__dropdown-menu">
          <button class="nav__dropdown-item" (click)="navigateTo('/candidato/crear')">
            Registrar Candidatos
          </button>
          <button class="nav__dropdown-item" (click)="navigateTo('/partidos/crear')">
            Registrar Partidos
          </button>
        </div>
      </div>

      <!-- VERIFICACIÓN -->
      <div class="nav__dropdown">
        <button class="nav__dropdown-title">✓ Verificación</button>
        <div class="nav__dropdown-menu">
          <button class="nav__dropdown-item" (click)="navigateTo('/verificacion-candidatos')">
            Candidatos
          </button>
          <button class="nav__dropdown-item" (click)="navigateTo('/verificacion-partidos')">
            Partidos
          </button>
        </div>
      </div>

      <!-- LOGÍSTICA -->
      <div class="nav__dropdown">
        <button class="nav__dropdown-title">📍 Logística</button>
        <div class="nav__dropdown-menu">
          <button class="nav__dropdown-item" (click)="navigateTo('/cambio-centro')">
            Cambio de Centro
          </button>
        </div>
      </div>

      <!-- JURADOS -->
      <div class="nav__dropdown">
        <button class="nav__dropdown-title">👥 Jurados</button>
        <div class="nav__dropdown-menu">
          <button class="nav__dropdown-item" (click)="navigateTo('/jurado/sorteo')">
            Sorteo de Jurados
          </button>
          <button class="nav__dropdown-item" (click)="navigateTo('/jurado/listar')">
            Gestión de Jurados
          </button>
          <button class="nav__dropdown-item" (click)="navigateTo('/jurado/capacitacion')">
            Capacitación
          </button>
        </div>
      </div>

      <div class="nav__divider"></div>

      <!-- BOTÓN SEARCH -->
      <button class="nav__search-btn">🔍</button>
    </nav>

    <!-- ACTIONS -->
    <div class="header__actions">
      <ng-container *ngIf="isAuthenticated; else loginBlock">
        <!-- USUARIO INFO (INVERSO) CON ROL -->
        <div class="user-info">
          <div class="user-header">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ userRole }}</span>
          </div>
        </div>

        <!-- LOGOUT -->
        <button class="btn-access" (click)="onLogout()">Cerrar sesión</button>
      </ng-container>

      <!-- LOGIN -->
      <ng-template #loginBlock>
        <a routerLink="/login" class="btn-access"> Login </a>
      </ng-template>
    </div>
  </div>
</header>

<!-- ═══════════════════ BREADCRUMB ═══════════════════ -->
<div class="breadcrumb-bar">
  <div class="container breadcrumb__inner">
    <nav class="breadcrumb">
      <a routerLink="/" class="breadcrumb__item">Inicio</a>
      <span class="breadcrumb__sep">›</span>
      <span class="breadcrumb__item breadcrumb__item--active"> Módulo Electoral </span>
    </nav>

    <div class="breadcrumb__meta">
      <div class="breadcrumb__status-dot"></div>
      <span>Sistema activo · Jornada Electoral 2026</span>
    </div>
  </div>
</div>
