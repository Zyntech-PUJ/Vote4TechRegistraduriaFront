<!-- ══ HEADER PRINCIPAL ══ -->
<header class="header">
  <div class="header__inner">
    <!-- LOGO -->
    <a routerLink="/" class="logo">
      <div class="logo__shield">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
          />
        </svg>
      </div>
      <div class="logo__text">
        <span class="logo__name">Vote<em>4</em>Tech</span>
        <span class="logo__sub">Sistema Electoral Nacional</span>
      </div>
    </a>

    <!-- NAV -->
    <nav class="nav">
      <a
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
        >Inicio</a
      >
      <a class="nav__link">Funcionalidades</a>
      <a class="nav__link">Proceso Electoral</a>
      <a class="nav__link">Boletines</a>
      <div class="nav__divider"></div>
      <a class="nav__link">Documentación</a>
      <button class="nav__search-btn" aria-label="Buscar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35" />
        </svg>
      </button>
    </nav>

    <!-- ACTIONS -->
    <div class="header__actions">
      <button class="btn-access" (click)="handleAuthAction()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
          />
        </svg>
        {{ isLogged ? 'Cerrar sesión' : 'Login' }}
      </button>
    </div>
  </div>
</header>
